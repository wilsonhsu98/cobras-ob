[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

# SPA：所有路徑都交給 React Router（/.netlify/* 不受影響）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
