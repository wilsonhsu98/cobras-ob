<!doctype html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15120F" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <title>CobrasOB</title>
    <!-- 外觀偏好（淺色／自動／深色）在畫面出現前先套用，避免閃一下；key 與預設值要跟 src/lib/theme.js 一致 -->
    <script>
      try {
        var t = localStorage.getItem('cobras:theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'auto' ? t : 'dark';
      } catch (e) { /* 維持上面 <html> 寫的 dark */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
